name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: huggingface-space
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Hugging Face CLI
        run: pip install 'huggingface_hub>=1.19.0'
      - name: Sync files to Space
        env:
          HF_OIDC_RESOURCE: spaces/huggingface-KREW/smol-training-playbook-ko
        shell: bash
        run: |
          set -euo pipefail
          hf_token="$(hf auth token)"
          echo "::add-mask::$hf_token"
          export HF_SYNC_TOKEN="$hf_token"
          askpass="$RUNNER_TEMP/hf-askpass.sh"
          cat > "$askpass" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'oauth2' ;;
            *) printf '%s\n' "$HF_SYNC_TOKEN" ;;
          esac
          ASKPASS
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0
          destination="$RUNNER_TEMP/hf-space"
          GIT_LFS_SKIP_SMUDGE=1 git clone https://huggingface.co/spaces/huggingface-KREW/smol-training-playbook-ko "$destination"
          rsync -a --delete --exclude='.git/' --exclude='.github/' "$GITHUB_WORKSPACE/" "$destination/"
          cd "$destination"
          git config user.name 'KREW GitHub Sync'
          git config user.email 'noreply@huggingface.co'
          git add --all
          if git diff --cached --quiet; then
            echo 'Space already matches GitHub.'
          else
            git commit -m "Sync from GitHub ${GITHUB_SHA}"
            git push origin main
          fi
